name: CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Production Build & Deploy Trigger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npm run build

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Notify Deployment Ready
        run: |
          echo "✅ Main branch built successfully. Production deployment triggered on Render & Vercel."
