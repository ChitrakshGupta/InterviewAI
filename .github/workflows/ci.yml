name: CI Pipeline

on:
  push:
    branches:
      - '*'
      - '!main'
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend CI (Build & Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Typecheck & Build Backend
        run: |
          cd backend
          npm run build

      - name: Security Check
        run: |
          cd backend
          npm audit --audit-level=high || true

  frontend-ci:
    name: Frontend CI (Build & Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Security Check
        run: |
          cd frontend
          npm audit --audit-level=high || true
